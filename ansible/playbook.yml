---
- name: Configure the Tailscale Tor exit node
  hosts: exit_nodes
  become: true
  gather_facts: false
  vars:
    # Only needed until the node has joined the tailnet; re-runs work without it.
    tailscale_auth_key: "{{ lookup('ansible.builtin.env', 'TS_AUTHKEY') }}"
    tailscale_hostname: "{{ inventory_hostname }}"
    monitoring_enabled: false

  pre_tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      # 2 = finished with recoverable warnings
      failed_when: cloud_init.rc not in [0, 2]

    - name: Gather facts
      ansible.builtin.setup:

    # The node's own DNS goes through Tor, so with Tor down nothing can be
    # installed or pulled to repair it. Take the exit node off the tailnet
    # first (clients fail closed), then let the node resolve directly. The
    # networking and tailscale roles bring both back once Tor is healthy.
    - name: Take the exit node offline while Tor is down
      ansible.builtin.shell: |
        set -e
        health=$(docker inspect --format {% raw %}'{{.State.Health.Status}}'{% endraw %} tor-proxy 2>/dev/null || true)
        if [ "$health" = healthy ] || ! systemctl is-active --quiet transparent-proxy; then
          exit 0
        fi
        if command -v tailscale >/dev/null; then tailscale down; fi
        systemctl stop transparent-proxy
        echo "maintenance mode (tor-proxy: ${health:-missing})"
      register: maintenance
      changed_when: maintenance.stdout is search('maintenance mode')

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        cache_valid_time: 3600
      register: apt_upgrade
      until: apt_upgrade is succeeded
      retries: 5
      delay: 30

  roles:
    - system-hardening
    - docker
    - tor-container
    # From here on the node's DNS goes through Tor (which is healthy by now).
    - networking
    # Last, so clients can only reach the node once the redirects are in place.
    - tailscale
    - role: monitoring
      when: monitoring_enabled | bool

  post_tasks:
    - name: Run the exit node health and leak check
      ansible.builtin.command: /usr/local/sbin/tor-exit-check
      register: exit_check
      changed_when: false
      failed_when: false

    - name: Show the check results
      ansible.builtin.debug:
        msg: "{{ exit_check.stdout_lines }}"

    - name: Fail if a required check failed
      ansible.builtin.fail:
        msg: "tor-exit-check reported failures; see the results above."
      when: exit_check.rc != 0
