---
- name: Configure KVM Tailscale Tor Exit Node
  hosts: exit_nodes
  become: true
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  pre_tasks:
    - name: Wait for system to become reachable
      wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to complete
      wait_for:
        path: /var/lib/cloud/instance/boot-finished
        timeout: 600

    - name: Wait for network to be ready
      uri:
        url: http://archive.ubuntu.com/ubuntu/
        method: HEAD
        timeout: 10
      register: network_test
      until: network_test is succeeded
      retries: 30
      delay: 10

    - name: Update package cache with retries
      apt:
        update_cache: true
        cache_valid_time: 3600
      register: apt_update
      until: apt_update is succeeded
      retries: 10
      delay: 30

    - name: Ensure system is fully updated
      apt:
        upgrade: dist
        update_cache: true
      register: apt_upgrade
      until: apt_upgrade is succeeded
      retries: 5
      delay: 60

  roles:
    - system-hardening
    - docker
    - tor-container  # First setup secure Tor proxy
    - networking     # Configure transparent proxy iptables
    - tailscale      # Then setup Tailscale exit node
    #- monitoring

  post_tasks:
    - name: Apply pending handler changes before verification
      meta: flush_handlers

    - name: Verify services are running
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - tailscaled
        - transparent-proxy
        - tor-monitor

    - name: Verify Docker Tor container
      command: docker inspect -f '{{ "{{" }} .State.Status {{ "}}" }}' tor-proxy
      register: tor_container_state
      changed_when: false
      failed_when: tor_container_state.stdout != "running"

    - name: Check iptables transparent proxy rules
      shell: iptables -t nat -S TORPROXY_OUT | grep -q -- '--to-ports 9040'
      changed_when: false

    # Plain HTTPS from the VM: it must be redirected into Tor by the rules.
    - name: Test Tor connectivity through the transparent proxy
      uri:
        url: https://check.torproject.org/api/ip
        method: GET
        timeout: 60
      register: tor_test
      until: tor_test.json is defined and tor_test.json.IsTor | default(false)
      retries: 5
      delay: 10

    - name: Display deployment status
      debug:
        msg:
          - "KVM Tailscale Tor Exit Node deployment completed successfully!"
          - "VM IP: {{ ansible_default_ipv4.address }}"
          - "Tailscale status: Run 'sudo tailscale status' to check"
          - "Tor container: {{ tor_container_state.stdout }}"
          - "Tor exit IP: {{ tor_test.json.IP }}"
          - "Next step: Authorize this machine in Tailscale admin panel"
          - "Verify exit node: ssh to VM and run 'curl -s https://check.torproject.org/api/ip'"
