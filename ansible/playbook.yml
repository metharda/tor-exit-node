---
- name: Configure the Tailscale Tor exit node
  hosts: exit_nodes
  become: true
  gather_facts: false
  vars:
    # Only needed until the node has joined the tailnet; re-runs work without it.
    tailscale_auth_key: "{{ lookup('ansible.builtin.env', 'TS_AUTHKEY') }}"
    tailscale_hostname: "{{ inventory_hostname }}"
    monitoring_enabled: false

  pre_tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      # 2 = finished with recoverable warnings
      failed_when: cloud_init.rc not in [0, 2]

    - name: Gather facts
      ansible.builtin.setup:

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        cache_valid_time: 3600
      register: apt_upgrade
      until: apt_upgrade is succeeded
      retries: 5
      delay: 30

  roles:
    - system-hardening
    - docker
    - tor-container
    - tailscale
    # Last: once it runs, the VM's own DNS goes through Tor.
    - networking
    - role: monitoring
      when: monitoring_enabled | bool

  post_tasks:
    - name: Run the exit node health and leak check
      ansible.builtin.command: /usr/local/sbin/tor-exit-check
      register: exit_check
      changed_when: false
      failed_when: false

    - name: Show the check results
      ansible.builtin.debug:
        msg: "{{ exit_check.stdout_lines }}"

    - name: Fail if a required check failed
      ansible.builtin.fail:
        msg: "tor-exit-check reported failures; see the results above."
      when: exit_check.rc != 0
