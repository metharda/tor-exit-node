---
# Optional (monitoring_enabled=true). node_exporter listens on :9100, which
# UFW only exposes on tailscale0.
- name: Create the node_exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download node_exporter
  ansible.builtin.get_url:
    url: "{{ monitoring_node_exporter_release }}/node_exporter-{{ monitoring_node_exporter_version }}.linux-amd64.tar.gz"
    checksum: "sha256:{{ monitoring_node_exporter_release }}/sha256sums.txt"
    dest: /tmp/node_exporter.tar.gz
    mode: '0644'

- name: Install the node_exporter binary
  ansible.builtin.unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - --strip-components=1
      - --wildcards
      - "*/node_exporter"
  notify: Restart node_exporter

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    mode: '0755'

- name: Install the node_exporter service
  ansible.builtin.template:
    src: node-exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  notify: Restart node_exporter

- name: Install the Tor metrics script
  ansible.builtin.copy:
    dest: /usr/local/sbin/tor-metrics
    content: |
      #!/bin/bash
      # Writes exit node metrics for node_exporter's textfile collector.
      set -uo pipefail
      out=/var/lib/node_exporter/textfile_collector/tor.prom
      healthy=0; [[ "$(docker inspect --format '{{ '{{' }}.State.Health.Status{{ '}}' }}' tor-proxy 2>/dev/null)" == healthy ]] && healthy=1
      tailscale=0; [[ "$(tailscale status --json 2>/dev/null | jq -r .BackendState)" == Running ]] && tailscale=1
      proxy=0; /usr/local/sbin/transparent-proxy status >/dev/null 2>&1 && proxy=1
      printf 'tor_bootstrapped %s\ntailscale_running %s\ntransparent_proxy_rules_present %s\n' \
        "$healthy" "$tailscale" "$proxy" > "$out.tmp" && mv "$out.tmp" "$out"
    mode: '0755'

- name: Collect Tor metrics every minute
  ansible.builtin.cron:
    name: tor-metrics
    job: /usr/local/sbin/tor-metrics
    user: root

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
