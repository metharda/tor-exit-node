---
- name: Install essential packages
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - apt-listchanges
      - curl
      - dnsutils
      - jq
      - htop
      - vim
    state: present
    update_cache: true
  register: package_install
  until: package_install is succeeded
  retries: 5
  delay: 30

- name: Remove unnecessary packages
  ansible.builtin.apt:
    name:
      - snapd
      - whoopsie
      - ubuntu-report
      - popularity-contest
    state: absent
    purge: true
    autoremove: true

- name: Configure automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: '0644'

- name: Enable automatic updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'

- name: Harden SSH configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    mode: '0600'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Lock the root password
  ansible.builtin.user:
    name: root
    password_lock: true

- name: Set UFW default policies
  community.general.ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
    - { direction: routed, policy: deny }

- name: Allow SSH and Tailscale
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop:
    - { port: "22", proto: tcp, comment: SSH }
    - { port: "41641", proto: udp, comment: Tailscale }

- name: Allow everything arriving over the tailnet
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0
    comment: Tailnet

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5

      [sshd]
      enabled = true
      port = 22
      filter = sshd
      backend = systemd
      maxretry = 3
    mode: '0644'
  notify: Restart fail2ban

- name: Disable IPv6
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/90-tor-exit.conf
  loop:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6
    - net.ipv6.conf.lo.disable_ipv6

- name: Apply kernel network hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-tor-exit.conf
  loop:
    # Tailscale refuses to act as an exit node without forwarding; the
    # transparent-proxy firewall rejects anything that would actually be
    # forwarded from tailnet clients.
    - { key: net.ipv4.ip_forward, value: "1" }
    # Only clears Tailscale's "IP forwarding is disabled" warning for ::/0:
    # IPv6 is disabled on every interface, so nothing can be forwarded.
    - { key: net.ipv6.conf.all.forwarding, value: "1" }
    - { key: net.ipv4.conf.all.send_redirects, value: "0" }
    - { key: net.ipv4.conf.default.send_redirects, value: "0" }
    - { key: net.ipv4.conf.all.accept_redirects, value: "0" }
    - { key: net.ipv4.conf.default.accept_redirects, value: "0" }
    - { key: net.ipv4.conf.all.secure_redirects, value: "0" }
    - { key: net.ipv4.conf.default.secure_redirects, value: "0" }
    - { key: net.ipv4.icmp_echo_ignore_broadcasts, value: "1" }
    - { key: net.ipv4.icmp_ignore_bogus_error_responses, value: "1" }
    - { key: net.ipv4.tcp_syncookies, value: "1" }
    - { key: net.ipv4.conf.all.rp_filter, value: "2" }
    - { key: net.ipv4.conf.default.rp_filter, value: "2" }

- name: Enable essential services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - fail2ban
    - unattended-upgrades
