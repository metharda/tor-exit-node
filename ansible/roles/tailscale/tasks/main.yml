---
- name: Add the Tailscale apt signing key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'

- name: Add the Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main
    filename: tailscale
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true

- name: Read the Tailscale login state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Determine whether the node still has to join the tailnet
  ansible.builtin.set_fact:
    tailscale_needs_login: >-
      {{ tailscale_status.rc != 0 or (tailscale_status.stdout | from_json).BackendState != 'Running' }}

- name: Require an auth key for the first login
  ansible.builtin.assert:
    that: tailscale_auth_key | length > 0
    fail_msg: >-
      This node has not joined the tailnet yet. Export TS_AUTHKEY (a key from
      https://login.tailscale.com/admin/settings/keys) and run again.
    quiet: true
  when: tailscale_needs_login

# --netfilter-mode=off: the transparent-proxy firewall owns iptables; letting
#   tailscaled add its own forward/NAT rules would let client traffic bypass Tor.
# --accept-dns=false: the node's resolver must stay pointed at Tor, not MagicDNS.
- name: Bring Tailscale up as an exit node
  ansible.builtin.command: >-
    tailscale up --reset
    --advertise-exit-node
    --netfilter-mode=off
    --accept-dns=false
    --hostname={{ tailscale_hostname }}
    {{ ('--auth-key=' ~ tailscale_auth_key) if tailscale_needs_login else '' }}
  register: tailscale_up
  changed_when: tailscale_needs_login
  no_log: "{{ tailscale_needs_login }}"

- name: Wait for tailscaled to connect
  ansible.builtin.command: tailscale status --json
  register: tailscale_connected
  until: (tailscale_connected.stdout | from_json).BackendState == 'Running'
  retries: 12
  delay: 5
  changed_when: false

- name: Show next step
  ansible.builtin.debug:
    msg: >-
      Tailscale is up as {{ tailscale_hostname }}. Approve it as an exit node at
      https://login.tailscale.com/admin/machines unless your ACLs auto-approve it.
