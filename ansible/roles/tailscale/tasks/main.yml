---
# Runs after the networking role: Tor is bootstrapped and the firewall is active.
- name: Create Tailscale service override directory
  file:
    path: /etc/systemd/system/tailscaled.service.d
    state: directory
    mode: '0755'

- name: Create Tailscale service hardening override
  copy:
    dest: /etc/systemd/system/tailscaled.service.d/hardening.conf
    content: |
      [Service]
      NoNewPrivileges=yes
      PrivateTmp=yes
      ProtectSystem=strict
      # tailscaled keeps its node key and state here; it must stay writable.
      ReadWritePaths=-/var/lib/tailscale -/run/tailscale -/var/cache/tailscale
      ProtectHome=yes
      ProtectKernelTunables=no
      ProtectKernelModules=yes
      ProtectControlGroups=yes
      RestrictSUIDSGID=yes
      RemoveIPC=yes
      RestrictRealtime=yes
      RestrictNamespaces=yes
      LockPersonality=yes
      MemoryDenyWriteExecute=yes
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
      SystemCallFilter=@system-service
      SystemCallErrorNumber=EPERM
    mode: '0644'
  notify: restart tailscaled

- name: Add Tailscale GPG key
  apt_key:
    url: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg
    state: present
    keyring: /usr/share/keyrings/tailscale-archive-keyring.gpg

- name: Add Tailscale repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu jammy main"
    state: present
    update_cache: true

- name: Install Tailscale
  apt:
    name: tailscale
    state: present

- name: Enable and start Tailscale service
  systemd:
    name: tailscaled
    state: started
    enabled: true
    daemon_reload: true

- name: Apply tailscaled changes before joining
  meta: flush_handlers

- name: Create Tailscale setup script
  template:
    src: tailscale-setup.sh.j2
    dest: /usr/local/sbin/tailscale-setup.sh
    mode: '0750'
    owner: root
    group: root

# The auth key only comes from the environment of this task; a node that is
# already logged in is not joined again, so a used single-use key is fine.
- name: Join the tailnet as an exit node
  command: /usr/local/sbin/tailscale-setup.sh
  environment:
    TS_AUTH_KEY: "{{ tailscale_auth_key | default(lookup('env', 'TAILSCALE_AUTH_KEY')) }}"
  register: tailscale_setup_result
  changed_when: "'joined' in tailscale_setup_result.stdout"
  no_log: true

- name: Show Tailscale setup result
  debug:
    msg: "{{ tailscale_setup_result.stdout_lines }}"

- name: Get Tailscale status
  command: tailscale status --json
  register: tailscale_status
  changed_when: false

- name: Display Tailscale configuration
  debug:
    msg:
      - "Tailscale is running and configured as exit node"
      - "Remember to authorize this machine in the Tailscale admin panel"
      - "Admin panel: https://login.tailscale.com/admin/machines"
