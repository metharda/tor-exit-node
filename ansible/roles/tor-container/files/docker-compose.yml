services:
  tor-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      # Build steps share the VM's network, so they follow the same Tor rules.
      network: host
    image: tor-proxy:local
    container_name: tor-proxy
    restart: unless-stopped
    # Host networking: TransPort must see the original destination from the
    # VM's own NAT table. No Docker network is created.
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - tor-data:/var/lib/tor

volumes:
  tor-data:
