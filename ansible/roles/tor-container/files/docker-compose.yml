version: '3.8'

services:
  tor-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tor-proxy
    restart: unless-stopped
    expose:
      - "9040"
      - "9050" 
      - "9053"
    networks:
      tor-network:
        ipv4_address: 172.20.0.10
    volumes:
      - tor-data:/var/lib/tor
    environment:
      - TOR_LOG_LEVEL=notice
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9050"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  tor-network:
    external: true

volumes:
  tor-data: