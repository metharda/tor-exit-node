---
- name: Create Tor container directory
  file:
    path: /opt/tor-proxy
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Copy Tor container files
  copy:
    src: "{{ item.src }}"
    dest: "/opt/tor-proxy/{{ item.src }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - {src: torrc, mode: '0644'}
    - {src: Dockerfile, mode: '0644'}
    - {src: entrypoint.sh, mode: '0755'}
    - {src: docker-compose.yml, mode: '0644'}

# Uses the build cache; the image and container only change when the files do.
# Host networking: no Docker network is created.
- name: Build and start Tor container
  command: docker compose up -d --build
  args:
    chdir: /opt/tor-proxy
  register: tor_compose_up
  changed_when: tor_compose_up.stderr is search('Recreated|Created|Started')

- name: Read the tor uid from the image
  command: docker run --rm --network none --entrypoint id tor-proxy:local -u tor
  register: tor_uid_result
  changed_when: false

- name: Remember the tor uid for the firewall rules
  set_fact:
    tor_uid: "{{ tor_uid_result.stdout | trim | int }}"

- name: Wait for Tor to bootstrap
  shell: docker logs tor-proxy 2>&1 | grep -q 'Bootstrapped 100%'
  register: tor_bootstrap
  until: tor_bootstrap.rc == 0
  retries: 60
  delay: 5
  changed_when: false

- name: Check Tor SOCKS
  command: curl -sf --max-time 60 --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip
  register: tor_socks_check
  until: tor_socks_check.rc == 0 and '"IsTor":true' in tor_socks_check.stdout
  retries: 5
  delay: 10
  changed_when: false

- name: Check Tor DNSPort (UDP)
  command: dig +time=10 +tries=2 @127.0.0.1 -p 9053 check.torproject.org A +short
  register: tor_dns_check
  until: tor_dns_check.rc == 0 and tor_dns_check.stdout | length > 0
  retries: 5
  delay: 10
  changed_when: false
