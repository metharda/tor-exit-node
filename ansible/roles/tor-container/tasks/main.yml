---
- name: Create the Tor container directory
  ansible.builtin.file:
    path: /opt/tor-proxy
    state: directory
    mode: '0755'

- name: Copy the Tor container build files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /opt/tor-proxy/{{ item }}
    mode: '0644'
  loop:
    - Dockerfile
    - torrc
    - docker-compose.yml
  register: tor_files

# Building only on changes keeps re-runs from recreating the container (and
# cutting clients off while Tor restarts). `up` builds the image if it is missing.
- name: Build the Tor image
  ansible.builtin.command: docker compose build
  args:
    chdir: /opt/tor-proxy
  when: tor_files is changed
  changed_when: true

- name: Start the Tor container
  ansible.builtin.command: docker compose up --detach --remove-orphans
  args:
    chdir: /opt/tor-proxy
  register: compose_up
  changed_when: compose_up.stderr is search('Recreated|Created|Started')

- name: Wait for Tor to bootstrap
  block:
    - name: Wait until the container health check passes (bootstrapped 100%)
      ansible.builtin.command: >-
        docker inspect --format {% raw %}'{{.State.Health.Status}}'{% endraw %} tor-proxy
      register: tor_health
      until: tor_health.stdout == 'healthy'
      retries: 60
      delay: 10
      changed_when: false
  rescue:
    - name: Collect the Tor log
      ansible.builtin.command: docker logs --tail 40 tor-proxy
      register: tor_logs
      changed_when: false

    - name: Report the bootstrap failure
      ansible.builtin.fail:
        msg: "{{ ['Tor did not bootstrap within 10 minutes. Last log lines:'] + tor_logs.stdout_lines + tor_logs.stderr_lines }}"

- name: Install the Tor watchdog
  ansible.builtin.copy:
    src: tor-watchdog.sh
    dest: /usr/local/sbin/tor-watchdog
    mode: '0755'

- name: Install the Tor watchdog units
  ansible.builtin.copy:
    dest: /etc/systemd/system/{{ item.name }}
    content: "{{ item.content }}"
    mode: '0644'
  loop:
    - name: tor-watchdog.service
      content: |
        [Unit]
        Description=Restart the Tor container if unhealthy and restore proxy rules
        After=docker.service
        Requires=docker.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/tor-watchdog
    - name: tor-watchdog.timer
      content: |
        [Unit]
        Description=Run the Tor watchdog every two minutes

        [Timer]
        OnBootSec=5min
        OnUnitActiveSec=2min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"

- name: Enable the Tor watchdog timer
  ansible.builtin.systemd:
    name: tor-watchdog.timer
    enabled: true
    state: started
    daemon_reload: true
