---
- name: Install the transparent-proxy script
  ansible.builtin.copy:
    src: transparent-proxy.sh
    dest: /usr/local/sbin/transparent-proxy
    mode: '0755'
  notify: Restart transparent-proxy

- name: Install the transparent-proxy service
  ansible.builtin.copy:
    dest: /etc/systemd/system/transparent-proxy.service
    content: |
      [Unit]
      Description=Transparent Tor routing for Tailscale exit-node clients
      After=network-online.target ufw.service docker.service tailscaled.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/transparent-proxy start
      ExecStop=/usr/local/sbin/transparent-proxy stop

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  notify: Restart transparent-proxy

- name: Enable and start the transparent proxy
  ansible.builtin.systemd:
    name: transparent-proxy
    enabled: true
    state: started
    daemon_reload: true

- name: Apply transparent-proxy changes now
  ansible.builtin.meta: flush_handlers

- name: Install the exit node health check
  ansible.builtin.copy:
    src: tor-exit-check.sh
    dest: /usr/local/sbin/tor-exit-check
    mode: '0755'
