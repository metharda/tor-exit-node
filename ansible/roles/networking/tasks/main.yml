---
# iptables owns the firewall (UFW stays disabled). The rules script only touches
# the project's TORPROXY_* chains and is re-applied by transparent-proxy.service.
- name: Create iptables rules script
  template:
    src: iptables-rules.sh.j2
    dest: /opt/iptables-rules.sh
    mode: '0755'
    owner: root
    group: root
  notify: restart transparent-proxy

- name: Create transparent proxy systemd service
  copy:
    dest: /etc/systemd/system/transparent-proxy.service
    mode: '0644'
    content: |
      [Unit]
      Description=Transparent Tor proxy firewall rules
      After=docker.service tailscaled.service
      # Re-apply the rules whenever tailscaled is (re)started.
      PartOf=tailscaled.service

      [Service]
      Type=oneshot
      ExecStart=/opt/iptables-rules.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target tailscaled.service
  notify: restart transparent-proxy

- name: Enable and start transparent proxy service
  systemd:
    name: transparent-proxy
    enabled: true
    state: started
    daemon_reload: true
