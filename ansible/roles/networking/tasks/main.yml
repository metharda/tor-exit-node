---
# iptables owns the firewall (UFW stays disabled). The rules script only touches
# the project's TORPROXY_* chains and is re-applied by transparent-proxy.service.
- name: Create iptables rules script
  template:
    src: iptables-rules.sh.j2
    dest: /opt/iptables-rules.sh
    mode: '0755'
    owner: root
    group: root
  notify: restart transparent-proxy

- name: Create transparent proxy systemd service
  copy:
    dest: /etc/systemd/system/transparent-proxy.service
    mode: '0644'
    content: |
      [Unit]
      Description=Transparent Tor proxy firewall rules
      After=docker.service tailscaled.service
      # Re-apply the rules whenever tailscaled is (re)started.
      PartOf=tailscaled.service

      [Service]
      Type=oneshot
      ExecStart=/opt/iptables-rules.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target tailscaled.service
  notify: restart transparent-proxy

- name: Enable and start transparent proxy service
  systemd:
    name: transparent-proxy
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending firewall changes before DNS is switched to Tor
  meta: flush_handlers

- name: Create DNS configuration script
  template:
    src: dns-config.sh.j2
    dest: /opt/dns-config.sh
    mode: '0755'
    owner: root
    group: root

- name: Point system DNS at Tor
  command: /opt/dns-config.sh
  register: dns_config_result
  changed_when: "'changed' in dns_config_result.stdout"

- name: Copy DNS test script to VM
  copy:
    src: "{{ playbook_dir }}/../scripts/test-dns.sh"
    dest: /opt/test-dns.sh
    mode: '0755'
    owner: root
    group: root

- name: Check DNS through Tor (UDP 53 is redirected to DNSPort)
  command: dig +time=10 +tries=2 check.torproject.org A +short
  register: dns_check
  until: dns_check.rc == 0 and dns_check.stdout | length > 0
  retries: 5
  delay: 10
  changed_when: false
