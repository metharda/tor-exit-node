---
# Docker's default seccomp profile is used. Compose v2 only ("docker compose").
- name: Install Docker and Compose v2
  apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present

# The Tor container uses host networking, so Docker needs no bridge, no
# iptables rules of its own and no IP forwarding; iptables-rules.sh owns the
# firewall.
- name: Configure Docker daemon for security
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2",
        "userland-proxy": false,
        "experimental": false,
        "live-restore": true,
        "no-new-privileges": true,
        "bridge": "none",
        "iptables": false,
        "ip6tables": false,
        "ip-forward": false
      }
    mode: '0644'
  notify: restart docker

- name: Enable and start Docker
  systemd:
    name: docker
    state: started
    enabled: true

- name: Apply Docker daemon changes before the Tor container is built
  meta: flush_handlers
