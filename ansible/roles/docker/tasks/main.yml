---
- name: Install Docker and Compose
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
  register: docker_install
  until: docker_install is succeeded
  retries: 5
  delay: 30

# Docker's built-in default seccomp profile stays in effect: it is maintained
# upstream and allows the thread creation Tor needs.
- name: Configure the Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "live-restore": true,
        "no-new-privileges": true,
        "userland-proxy": false
      }
    mode: '0644'
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Apply Docker daemon changes before building
  ansible.builtin.meta: flush_handlers
