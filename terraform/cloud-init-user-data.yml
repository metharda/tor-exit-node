#cloud-config
# Minimal bootstrap: a user Ansible can reach. Everything else, including
# Tailscale, is configured by Ansible so no secret ends up in this ISO except
# the console password.
hostname: ${hostname}
fqdn: ${hostname}.local
manage_etc_hosts: true

users:
  - name: ${username}
    gecos: Tor exit node admin
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: sudo
    lock_passwd: false
    plain_text_passwd: ${password}
    ssh_authorized_keys:
      - ${ssh_public_key}

ssh_pwauth: false

packages:
  - python3

final_message: "cloud-init finished after $UPTIME seconds; ready for Ansible"
