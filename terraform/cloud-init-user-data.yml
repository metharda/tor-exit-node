#cloud-config
hostname: ${hostname}
manage_etc_hosts: true
fqdn: ${hostname}.local

# Configure specified user
users:
  - name: ${username}
    gecos: VM User
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: sudo,docker
    lock_passwd: false
    # Password will be hashed by cloud-init
    plain_text_passwd: ${password}
    ssh_authorized_keys:
      - ${ssh_public_key}

# Also ensure default ubuntu user has the same access (fallback)
system_info:
  default_user:
    name: ${username}
    gecos: VM User
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: sudo,docker
    lock_passwd: false
    plain_text_passwd: ${password}

# Enable password authentication for SSH (in case of key issues)
ssh_pwauth: true
chpasswd:
  expire: false
  users:
    - name: ${username}
      password: ${password}
      type: text

# Network configuration
network:
  version: 2
  ethernets:
    enp1s0:
      dhcp4: true
      dhcp6: false

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - htop
  - vim
  - fail2ban
  - docker.io
  - docker-compose-v2
  - dnsutils
  - python3
  - python3-pip
  - bridge-utils

# Tailscale, Tor and the firewall are configured by Ansible after boot.
# The Tailscale auth key is never written to this cloud-init disk.
runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ${username}
  - ufw --force disable
  - echo "VM setup complete - Tor and Tailscale will be configured via Ansible!" > /var/log/cloud-init-setup.log

final_message: "Tor transparent proxy VM setup completed successfully!"
